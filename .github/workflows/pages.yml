name: Deploy BLAZE SHOW to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blaze-show-pages-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble compressed website bundle
        run: |
          cat deploy-parts/part-*.txt > /tmp/site-bundle.b64
          base64 --decode /tmp/site-bundle.b64 > /tmp/site-bundle.tar.xz
          mkdir -p site
          tar -xJf /tmp/site-bundle.tar.xz -C site
          test -s site/index.html
          test -s site/assets/css/styles.css
          test -s site/assets/js/app.js
      - name: Overlay editable campaign pages
        run: |
          mkdir -p site/campaigns
          cp campaign-files/blaze-packages.html campaign-files/bollywood.html campaign-files/campaign.css campaign-files/campaign.js campaign-files/campaign-settings.js site/campaigns/
          test -s site/campaigns/blaze-packages.html
          test -s site/campaigns/bollywood.html
          test -s site/campaigns/campaign.css
          test -s site/campaigns/campaign.js
          test -s site/campaigns/campaign-settings.js
          test -s site/assets/js/config.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
